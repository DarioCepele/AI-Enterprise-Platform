[project]
name = "demo-memory-service"
version = "0.1.0"
description = "Servizio di memoria conversazionale per il laboratorio AG-UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "pymongo>=4.16",
    "redis>=6.5",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    # Runtime e non solo dev: il riassuntore parla con un endpoint Chat
    # Completions, quindi httpx serve anche in produzione.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["integration: richiede Mongo e Redis veri (docker compose up -d mongo redis)"]
