[project]
name = "demo-memory-service"
version = "0.1.0"
description = "Servizio di memoria conversazionale per il laboratorio AG-UI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "redis>=6.5",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "psycopg[binary,pool]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["integration: richiede Mongo e Redis veri (docker compose up -d mongo redis)"]
