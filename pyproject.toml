[project]
name = "demo-voice-service"
version = "0.1.0"
description = "Voice service scaffold: health probes and the uv-managed skeleton the future Pipecat pipeline builds on"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2.1",
    "pipecat-ai>=1.8.1",
    "httpx>=0.28",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile>=0.13",
    "python-multipart>=0.0.20",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# faster-whisper, Kokoro and silero-vad ship no type information (no py.typed,
# no stubs on typeshed): their imports are the only place `strict` is relaxed.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro.*", "silero_vad.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_service"]
