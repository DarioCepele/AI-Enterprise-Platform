[project]
name = "demo-knowledge-agent"
version = "0.1.0"
description = "Sottoagente di knowledge base esposto via A2A"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.17.0",
    "agent-framework-openai",
    "a2a-sdk[http-server]",
    "sse-starlette",
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "python-dotenv>=1.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.3", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["integration: richiede un knowledge agent in ascolto"]
