[project]
name = "demo-master-agent"
version = "0.1.0"
description = "Master agent del laboratorio AG-UI: AG-UI su SSE + tool nativi"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]",
    "agent-framework-ag-ui>=1.2.2",
    "agent-framework-core==1.17.0",
    "agent-framework-openai>=1.14.2",
    "fastapi>=0.139.2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary,pool]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]

[tool.hatch.build.targets.wheel.force-include]
"src/demo/skills" = "demo/skills"
