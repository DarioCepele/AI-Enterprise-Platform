name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The contracts are the only copy, and they live in demo-infra: without
      # this checkout the contract tests fail instead of passing quietly, which
      # is the whole point of them.
      - uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/demo-infra
          path: .contracts

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          AGUI_LAB_CONTRACTS: ${{ github.workspace }}/.contracts/contracts

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: frontend:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
