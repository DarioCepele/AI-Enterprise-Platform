name: infra

on:
  push:
    paths:
      - "demo-infra/**"
      - ".github/workflows/infra.yml"
  pull_request:
    paths:
      - "demo-infra/**"
      - ".github/workflows/infra.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-infra
    steps:
      - uses: actions/checkout@v5

      # Qui sta l'unica copia dei contratti: un sample che non e' JSON valido,
      # o che perde i campi di cui il messaggio d'errore ha bisogno, rompe i
      # test di tutti gli altri senza rompere i propri.
      - name: every contract is readable and declares who reads it
        run: |
          python - <<'PY'
          import json, pathlib, sys

          problems = []
          for path in sorted(pathlib.Path("contracts").rglob("*.json")):
              contract = json.loads(path.read_text(encoding="utf-8"))
              for field in ("contract", "version", "produced_by", "consumed_by", "sample"):
                  if field not in contract:
                      problems.append(f"{path}: missing '{field}'")
              if contract.get("contract") != str(path.with_suffix("")).replace("contracts/", "").replace("\\", "/"):
                  problems.append(f"{path}: the name does not match the path")
          print("\n".join(problems) or "contracts ok")
          sys.exit(1 if problems else 0)
          PY

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-infra
    steps:
      - uses: actions/checkout@v5
      - name: the compose file is valid with the example environment
        run: |
          cp .env.example .env
          sed -i 's/^\(DEMO_PUSH_SECRET\)=.*/\1=ci/' .env
          sed -i 's/^\(KNOWLEDGE_SERVICE_TOKEN\)=.*/\1=ci/' .env
          sed -i 's/^\(ANALYSIS_SERVICE_TOKEN\)=.*/\1=ci/' .env
          sed -i 's/^\(POSTGRES_PASSWORD\)=.*/\1=ci/' .env
          docker compose config > /dev/null

  env-table:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-infra
    steps:
      # Un checkout solo: prima ne servivano quattro, perche' la tabella si
      # genera leggendo i Settings di tre servizi diversi e quei servizi
      # stavano in repository separati.
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      # La tabella e' generata dai campi che leggono l'ambiente: se divergono,
      # il README sta documentando una configurazione che non esiste piu'.
      - run: uv run --project ../demo-master-agent python tools/env_table.py --check
