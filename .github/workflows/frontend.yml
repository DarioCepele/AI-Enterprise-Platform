name: frontend

on:
  push:
    paths:
      - "demo-frontend/**"
      - "demo-infra/contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "demo-frontend/**"
      - "demo-infra/contracts/**"
      - ".github/workflows/frontend.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit

      # I contratti li trova da se': `lib/contracts.ts` risolve
      # `../demo-infra/contracts`, che nel monorepo esiste davvero. Prima
      # serviva un checkout separato di demo-infra e AGUI_LAB_CONTRACTS.
      - run: npm test
