name: frontend

on:
  push:
    branches: [main]
    paths:
      - "demo-frontend/**"
      - "demo-infra/contracts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "demo-frontend/**"
      - "demo-infra/contracts/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint

      # The contracts are found on their own: `lib/contracts.ts` resolves
      # `../demo-infra/contracts`, which exists in the monorepo.
      - run: npm test

      # The production build compiles what the tests do not import: the
      # proxy that sets the security headers, the pages, the server bundle.
      - run: npm run build
