name: release

# A version tag publishes every image to GitHub Container Registry, each with
# a software bill of materials and build provenance attached (BuildKit
# attestations, stored next to the image in the registry): what went into an
# image, and how it was built, travel with it.
#
#   git tag v1.2.3 && git push origin v1.2.3
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: demo-master-agent, image: master-agent }
          - { project: demo-frontend, image: frontend }
          - { project: demo-memory-service, image: memory-service }
          - { project: demo-process-service, image: process-service }
          - { project: demo-knowledge-agent, image: knowledge-agent }
          - { project: demo-analysis-agent, image: analysis-agent }
          - { project: demo-scraping-mcp, image: scraping-mcp }
          - { project: demo-voice-service, image: voice-service }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3, 1.2 and the commit: a deployment pins the full version, an
      # upgrade path can follow the minor one.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.project }}
          build-contexts: platform-core=./packages/platform-core
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
