[project]
name = "demo-memory-service"
version = "0.1.0"
license = "Apache-2.0"
description = "Conversation memory: transcripts, summaries, durable facts, semantic search"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "platform-core[otel,postgres,runtime]",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "httpx>=0.28",
    "psycopg[binary,pool]>=3.3.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.16.8",
]

[tool.uv.sources]
platform-core = { path = "../packages/platform-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["integration: richiede un Postgres vero (docker compose up -d postgres)"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI vuole Depends/Query/Header come default degli argomenti: sono
# marcatori immutabili, non lo stato condiviso che B008 vuole intercettare.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
# I test sono fatti di assert: S101 qui non ha niente da dire.
"tests/*" = ["S101"]
