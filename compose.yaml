services:
  master-agent:
    build: ../demo-master-agent
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_COMPLETION_MODEL: ${OPENAI_CHAT_COMPLETION_MODEL}
      DEMO_FAKE_CLIENT: ${DEMO_FAKE_CLIENT:-false}
      DEMO_ALLOWED_ORIGINS: ${DEMO_ALLOWED_ORIGINS:-}
      DEMO_MEMORY_SERVICE_URL: http://memory-service:8100
      DEMO_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      DEMO_JSON_LOGS: ${JSON_LOGS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEMO_KNOWLEDGE_AGENT_URL: http://knowledge-agent:8200/
      DEMO_PUBLIC_URL: http://master-agent:8000
      DEMO_PUSH_SECRET: ${DEMO_PUSH_SECRET:?required in .env}
      DEMO_KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?required in .env}
      DEMO_SUBAGENT_WAIT_SECONDS: ${DEMO_SUBAGENT_WAIT_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-service:
        condition: service_healthy
      knowledge-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  memory-service:
    build: ../demo-memory-service
    environment:
      MEMORY_MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MEMORY_MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      MEMORY_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEMORY_SUMMARY_BASE_URL: ${OPENAI_BASE_URL}
      MEMORY_SUMMARY_API_KEY: ${OPENAI_API_KEY}
      MEMORY_SUMMARY_MODEL: ${MEMORY_SUMMARY_MODEL:-${OPENAI_CHAT_COMPLETION_MODEL}}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_RETENTION_DAYS: ${MEMORY_RETENTION_DAYS:-0}
      MEMORY_JSON_LOGS: ${JSON_LOGS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  knowledge-agent:
    build: ../demo-knowledge-agent
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_COMPLETION_MODEL: ${KNOWLEDGE_MODEL:-${OPENAI_CHAT_COMPLETION_MODEL}}
      KNOWLEDGE_BASE_URL: http://knowledge-agent:8200/
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ../demo-frontend
      args:
        NEXT_PUBLIC_AGUI_URL: http://localhost:8000/agui
    ports:
      - "3000:3000"
    depends_on:
      master-agent:
        condition: service_healthy

  mongo:
    image: mongo:8.0.16
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?required in .env}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8.2.3
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required in .env}", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
