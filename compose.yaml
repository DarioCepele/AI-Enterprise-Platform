services:
  master-agent:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build: ../demo-master-agent
    ports:
      - "8000:8000"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_COMPLETION_MODEL: ${OPENAI_CHAT_COMPLETION_MODEL}
      DEMO_FAKE_CLIENT: ${DEMO_FAKE_CLIENT:-false}
      DEMO_ALLOWED_ORIGINS: ${DEMO_ALLOWED_ORIGINS:-}
      DEMO_MEMORY_SERVICE_URL: http://memory-service:8100
      DEMO_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      DEMO_JSON_LOGS: ${JSON_LOGS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      DEMO_SUBAGENTS: >-
        [{"name": "knowledge", "url": "http://knowledge-agent:8200/",
          "token": "${KNOWLEDGE_SERVICE_TOKEN}"},
         {"name": "analysis", "url": "http://analysis-agent:8400/",
          "token": "${ANALYSIS_SERVICE_TOKEN}"}]
      DEMO_PUBLIC_URL: http://master-agent:8000
      DEMO_PUSH_SECRET: ${DEMO_PUSH_SECRET:?required in .env}
      DEMO_KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?required in .env}
      DEMO_SUBAGENT_WAIT_SECONDS: ${DEMO_SUBAGENT_WAIT_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      memory-service:
        condition: service_healthy
      knowledge-agent:
        condition: service_healthy
      analysis-agent:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  memory-service:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build: ../demo-memory-service
    environment:
      MEMORY_MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      MEMORY_MONGO_DATABASE: ${MONGO_INITDB_DATABASE}
      MEMORY_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/0
      MEMORY_SUMMARY_BASE_URL: ${OPENAI_BASE_URL}
      MEMORY_SUMMARY_API_KEY: ${OPENAI_API_KEY}
      MEMORY_SUMMARY_MODEL: ${MEMORY_SUMMARY_MODEL:-${OPENAI_CHAT_COMPLETION_MODEL}}
      MEMORY_EMBEDDING_MODEL: ${MEMORY_EMBEDDING_MODEL:-}
      MEMORY_RETENTION_DAYS: ${MEMORY_RETENTION_DAYS:-0}
      MEMORY_JSON_LOGS: ${JSON_LOGS:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  knowledge-agent:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build: ../demo-knowledge-agent
    ports:
      # On the loopback only: published so that a measurement -- or a service
      # started outside compose -- can reach the agent the way another
      # container does.
      - "127.0.0.1:8200:8200"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_COMPLETION_MODEL: ${KNOWLEDGE_MODEL:-${OPENAI_CHAT_COMPLETION_MODEL}}
      KNOWLEDGE_BASE_URL: http://knowledge-agent:8200/
      KNOWLEDGE_SERVICE_TOKEN: ${KNOWLEDGE_SERVICE_TOKEN:?required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  analysis-agent:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build: ../demo-analysis-agent
    ports:
      # On the loopback only: published so that a measurement -- or a service
      # started outside compose -- can reach the agent the way another
      # container does.
      - "127.0.0.1:8400:8400"
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_COMPLETION_MODEL: ${ANALYSIS_MODEL:-${OPENAI_CHAT_COMPLETION_MODEL}}
      ANALYSIS_BASE_URL: http://analysis-agent:8400/
      ANALYSIS_SERVICE_TOKEN: ${ANALYSIS_SERVICE_TOKEN:?required in .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8400/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    build: ../demo-frontend
    environment:
      AGUI_URL: ${AGUI_URL:-http://localhost:8000/agui}
      PRODUCT_NAME: ${PRODUCT_NAME:-AG-UI Lab}
    ports:
      - "3000:3000"
    depends_on:
      master-agent:
        condition: service_healthy

  mongo:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    image: mongo:8.0.16@sha256:4b58ebcb1dc7a7b4e84cd8ce9098d48764ae4478876898ff9551acf2ac4a6a6d
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?required in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?required in .env}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?required in .env}
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    image: redis:8.2.3@sha256:0908d9af26bf9b985e984a40a5eb82eed229b07a3317eee6843832c3cc3a9619
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?required in .env}", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  process-service:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    build: ../demo-process-service
    environment:
      PROCESS_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PROCESS_JSON_LOGS: ${JSON_LOGS:-false}
      PROCESS_PUBLIC_URL: http://process-service:8300
      PROCESS_PUSH_SECRET: ${DEMO_PUSH_SECRET:?required in .env}
      PROCESS_AGENTS: >-
        {"knowledge": "http://knowledge-agent:8200/",
         "analysis": "http://analysis-agent:8400/"}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "127.0.0.1:${PROCESS_HOST_PORT:-8300}:8300"
    depends_on:
      postgres:
        condition: service_healthy
      knowledge-agent:
        condition: service_healthy
      analysis-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8300/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    image: postgres:17-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?serve in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?serve in .env}
      POSTGRES_DB: ${POSTGRES_DB:?serve in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongo-data:
  postgres-data:
