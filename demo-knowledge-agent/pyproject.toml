[project]
name = "demo-knowledge-agent"
version = "0.1.0"
description = "Sottoagente di knowledge base esposto via A2A"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core==1.17.0",
    "agent-framework-openai",
    "a2a-sdk[http-server]",
    "fastapi>=0.120",
    # The version agent_framework_core's own "all" extra pins for
    # MCPStreamableHTTPTool -- added directly rather than pulling that
    # extra's few dozen unrelated provider packages in with it.
    "mcp>=1.24.0,<2",
    "uvicorn[standard]>=0.40",
    "python-dotenv>=1.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "types-protobuf>=7.35.1.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
markers = ["integration: richiede un knowledge agent in ascolto"]

[tool.mypy]
strict = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
