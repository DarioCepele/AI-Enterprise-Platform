[project]
name = "backend"
version = "0.1.0"
description = "Backend del laboratorio AG-UI"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-ag-ui>=1.2.2",
    "agent-framework-core==1.17.0",
    "agent-framework-openai>=1.14.2",
    "fastapi>=0.139.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
