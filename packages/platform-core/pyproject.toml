[project]
name = "platform-core"
version = "0.1.0"
license = "Apache-2.0"
description = "What every service of the platform shares: telemetry, migrations, SSRF guard, A2A push trust, service tokens, MCP wiring, request limits."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "starlette>=0.40",
]

[project.optional-dependencies]
# Each service installs only what it uses: a service without a database does
# not carry a Postgres driver because the migrations module exists.
otel = [
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-sdk>=1.30",
]
postgres = ["psycopg[binary,pool]>=3.2"]
a2a = ["a2a-sdk>=1.1"]
maf = ["agent-framework-core>=1.17"]
runtime = ["python-dotenv>=1.1", "uvicorn>=0.34"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.16.8",
    "a2a-sdk[postgresql]>=1.1",
    "agent-framework-core>=1.17",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "types-protobuf>=5.29",
    "python-dotenv>=1.1",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
strict = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106"]
# A helper for pytest suites: `assert` is how it reports, on purpose.
"src/platform_core/testing/*" = ["S101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]
