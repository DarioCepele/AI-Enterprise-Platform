# The same manifests, on a local k3s (k3d: k3s inside Docker).
#
# It exists to try them: a manifest nobody ever applied is a statement of
# intent. It changes three things, none of them the shape of the manifests:
#   - the images are the ones `docker compose build` just produced;
#   - the database stays outside the cluster, as in production: here it is the
#     compose one, reached by name because the cluster joins its network;
#   - the browser's addresses become the local port-forwards.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-platform

resources:
  - ../deploy

images:
  - { name: ghcr.io/your-org/master-agent, newName: agent-platform-master-agent, newTag: latest }
  - { name: ghcr.io/your-org/memory-service, newName: agent-platform-memory-service, newTag: latest }
  - { name: ghcr.io/your-org/knowledge-agent, newName: agent-platform-knowledge-agent, newTag: latest }
  - { name: ghcr.io/your-org/analysis-agent, newName: agent-platform-analysis-agent, newTag: latest }
  - { name: ghcr.io/your-org/frontend, newName: agent-platform-frontend, newTag: latest }
  - { name: ghcr.io/your-org/process-service, newName: agent-platform-process-service, newTag: latest }
  - { name: ghcr.io/your-org/voice-service, newName: agent-platform-voice-service, newTag: latest }
  - { name: ghcr.io/your-org/scraping-mcp, newName: agent-platform-scraping-mcp, newTag: latest }

patches:
  - target: { kind: ConfigMap, name: agent-platform }
    patch: |-
      - op: replace
        path: /data/AGUI_URL
        value: http://localhost:8000/agui
      - op: replace
        path: /data/PROCESS_URL
        value: http://localhost:8300
      - op: replace
        path: /data/VOICE_URL
        value: ws://localhost:8500/ws/voice
      - op: replace
        path: /data/MASTER_ALLOWED_ORIGINS
        value: http://localhost:3000
      - op: replace
        path: /data/PROCESS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - op: replace
        path: /data/VOICE_ALLOWED_ORIGINS
        value: http://localhost:3000
