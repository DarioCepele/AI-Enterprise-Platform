apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: agui-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        # Numerico, non un nome: kubelet verifica che l'utente non sia root
        # prima di avviare il container, e da un `USER service` non lo sa dire.
        # Un manifest con solo runAsNonRoot non parte proprio.
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/your-org/demo-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            # Next writes its cache under /app/.next: read-only here would
            # mean mounting a volume for it, which buys nothing.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
              cpu: 500m
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: AGUI_URL
              value: http://master-agent:8000/agui
            # Il browser chiama il servizio dei processi **direttamente**, quindi
            # questo e' un indirizzo di fuori: dentro il cluster sarebbe un nome
            # che la macchina di chi guarda non risolve. Va con l'ingress.
            - name: PROCESS_URL
              value: https://processi.example
            # Il server di Next ascolta su `HOSTNAME`, e in un pod quella
            # variabile e' il nome del pod: si legherebbe al proprio indirizzo e
            # basta. Il Service funzionerebbe lo stesso, un `port-forward` no --
            # e chi debugga si troverebbe una connessione rifiutata senza
            # capire perche'.
            - name: HOSTNAME
              value: "0.0.0.0"
          envFrom:
            - configMapRef:
                name: agui-lab
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 3000
      targetPort: 3000
