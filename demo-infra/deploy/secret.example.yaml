# The keys the workloads read from the Secret `agent-platform`. Not applied by
# kustomize: create the real one from your secret store, for example
#
#   kubectl -n agent-platform create secret generic agent-platform \
#     --from-literal=OPENAI_API_KEY=... --from-literal=PUSH_SECRET=... ...
#
# Each workload references only the keys it uses (`secretKeyRef`), so a
# compromised pod does not hold every credential of the platform.
apiVersion: v1
kind: Secret
metadata:
  name: agent-platform
type: Opaque
stringData:
  OPENAI_API_KEY: replace-me
  # Signs push notification tokens: master agent and process service.
  PUSH_SECRET: replace-me-with-openssl-rand-hex-24
  KNOWLEDGE_SERVICE_TOKEN: replace-me
  ANALYSIS_SERVICE_TOKEN: replace-me
  # One role and one database per service (see infra/postgres/provision.sh for
  # the shape): the managed Postgres needs the `vector` extension in `memory`.
  MASTER_POSTGRES_DSN: postgresql://master_svc:...@postgres.example:5432/master
  MEMORY_POSTGRES_DSN: postgresql://memory_svc:...@postgres.example:5432/memory
  PROCESS_POSTGRES_DSN: postgresql://process_svc:...@postgres.example:5432/processes
  AGENTS_POSTGRES_DSN: postgresql://agents_svc:...@postgres.example:5432/agents
