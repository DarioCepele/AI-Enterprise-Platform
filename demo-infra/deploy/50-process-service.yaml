apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: process-service
  labels:
    app.kubernetes.io/name: process-service
spec:
  # A StatefulSet, not for storage -- the state is in Postgres -- but for a
  # stable identity. DBOS recovers, on each replica, the workflows tagged with
  # that replica's executor id; with a Deployment every restart would bring a
  # new name and leave the previous pod's workflows unrecovered, and with a
  # shared default id every replica would recover everybody's. process-service-0
  # comes back as process-service-0, and resumes its own.
  serviceName: process-service-headless
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: process-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: process-service
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: process-service
          image: ghcr.io/your-org/process-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8300
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { memory: 256Mi, cpu: 100m }
            limits: { memory: 512Mi, cpu: "1" }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: PROCESS_EXECUTOR_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            # Where a remote agent sends its notifications back: the Service,
            # not a pod. Whichever replica receives it, the message goes
            # through Postgres to the step that is waiting.
            - { name: PROCESS_PUBLIC_URL, value: "http://process-service:8300" }
            - { name: PROCESS_JSON_LOGS, value: "true" }
            - name: PROCESS_APP_VERSION
              valueFrom: { configMapKeyRef: { name: agent-platform, key: PROCESS_APP_VERSION } }
            - name: PROCESS_AGENTS
              valueFrom: { configMapKeyRef: { name: agent-platform, key: PROCESS_AGENTS } }
            - name: PROCESS_ALLOWED_ORIGINS
              valueFrom: { configMapKeyRef: { name: agent-platform, key: PROCESS_ALLOWED_ORIGINS } }
            - name: OPENAI_BASE_URL
              valueFrom: { configMapKeyRef: { name: agent-platform, key: OPENAI_BASE_URL } }
            - name: OPENAI_CHAT_COMPLETION_MODEL
              valueFrom: { configMapKeyRef: { name: agent-platform, key: OPENAI_CHAT_COMPLETION_MODEL } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: agent-platform, key: OPENAI_API_KEY } }
            - name: PROCESS_POSTGRES_DSN
              valueFrom: { secretKeyRef: { name: agent-platform, key: PROCESS_POSTGRES_DSN } }
            - name: PROCESS_PUSH_SECRET
              valueFrom: { secretKeyRef: { name: agent-platform, key: PUSH_SECRET } }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
# The stable network identity the StatefulSet requires.
apiVersion: v1
kind: Service
metadata:
  name: process-service-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: process-service
  ports:
    - { name: http, port: 8300, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: process-service
spec:
  selector:
    app.kubernetes.io/name: process-service
  ports:
    - { name: http, port: 8300, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: process-service
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: process-service
