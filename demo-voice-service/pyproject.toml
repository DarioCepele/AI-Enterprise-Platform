[project]
name = "demo-voice-service"
version = "0.1.0"
license = "Apache-2.0"
description = "Real-time voice for the agent: VAD, speech-to-text, text-to-speech, barge-in"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2.1",
    "pipecat-ai>=1.8.1",
    "httpx>=0.28",
    "kokoro>=0.9.4",
    "misaki[en]>=0.9.4",
    "soundfile>=0.13",
    "python-multipart>=0.0.20",
    "platform-core[otel,runtime]",
    # Named directly only to choose where they come from (see [tool.uv.sources]):
    # the voice models run on CPU, and PyPI's Linux wheels drag in several GB of
    # CUDA libraries a CPU never uses.
    "torch",
    "torchaudio",
    # misaki's English G2P needs this spaCy model and, without it, tries to
    # pip-install it at run time -- into a read-only image with no pip. Pinned
    # here instead: reproducible, and nothing is downloaded while serving.
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv.sources]
platform-core = { path = "../packages/platform-core", editable = true }
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
# PyTorch's own index of CPU-only builds, as uv documents for PyTorch. Explicit:
# only the packages pointed at it above come from here.
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# faster-whisper, Kokoro and silero-vad ship no type information (no py.typed,
# no stubs on typeshed): their imports are the only place `strict` is relaxed.
[[tool.mypy.overrides]]
module = ["faster_whisper.*", "kokoro.*", "silero_vad.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_service"]

[tool.hatch.metadata]
# The spaCy model is published as a wheel on GitHub, not on PyPI.
allow-direct-references = true
