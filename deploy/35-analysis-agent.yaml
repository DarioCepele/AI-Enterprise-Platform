apiVersion: apps/v1
kind: Deployment
metadata:
  name: analysis-agent
  labels:
    app.kubernetes.io/name: analysis-agent
    app.kubernetes.io/part-of: agui-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: analysis-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analysis-agent
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analysis-agent
          image: ghcr.io/<owner>/demo-analysis-agent:<tag>
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8400
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8400
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8400
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: ANALYSIS_BASE_URL
              value: http://analysis-agent:8400/
            - name: ANALYSIS_JSON_LOGS
              value: "true"
          envFrom:
            - secretRef:
                name: agui-lab
            - configMapRef:
                name: agui-lab
---
apiVersion: v1
kind: Service
metadata:
  name: analysis-agent
spec:
  selector:
    app.kubernetes.io/name: analysis-agent
  ports:
    - port: 8400
      targetPort: 8400
