apiVersion: apps/v1
kind: Deployment
metadata:
  name: memory-service
  labels:
    app.kubernetes.io/name: memory-service
    app.kubernetes.io/part-of: agui-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: memory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memory-service
    spec:
      securityContext:
        runAsNonRoot: true
        # Numerico, non un nome: kubelet verifica che l'utente non sia root
        # prima di avviare il container, e da un `USER service` non lo sa dire.
        # Un manifest con solo runAsNonRoot non parte proprio.
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: memory-service
          image: ghcr.io/your-org/demo-memory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 1
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8100
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8100
            periodSeconds: 5
            failureThreshold: 3
          env:
            - name: MEMORY_JSON_LOGS
              value: "true"
          envFrom:
            - secretRef:
                name: agui-lab
            - configMapRef:
                name: agui-lab
---
apiVersion: v1
kind: Service
metadata:
  name: memory-service
spec:
  selector:
    app.kubernetes.io/name: memory-service
  ports:
    - port: 8100
      targetPort: 8100
