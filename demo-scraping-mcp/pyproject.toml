[project]
name = "demo-scraping-mcp"
version = "0.1.0"
license = "Apache-2.0"
description = "Self-hosted MCP server: fetches a URL and returns it as Markdown, via Crawl4AI"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "crawl4ai>=0.9",
    "platform-core",
    "pydantic-settings>=2.10",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true

# crawl4ai ships no type information (no py.typed, no stubs on typeshed).
[[tool.mypy.overrides]]
module = ["crawl4ai.*"]
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.uv.sources]
platform-core = { path = "../packages/platform-core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraping_mcp"]
